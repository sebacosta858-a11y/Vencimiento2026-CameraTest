<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Vencimiento2026 — Prueba de cámara</title>

<link rel="stylesheet" href="css/styles.css">

<!-- Biblioteca ZXing Browser 0.2.1 -->
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
```

</head>

<body>
    <div class="container">
        <h1>Vencimiento2026 — Prueba de cámara</h1>

```
    <div class="status-box">
        <div class="status-item">
            <span>Contexto Seguro (HTTPS / Local):</span>
            <span id="secureStatus" class="badge">Verificando...</span>
        </div>

        <div class="status-item">
            <span>API getUserMedia:</span>
            <span id="apiStatus" class="badge">Verificando...</span>
        </div>
    </div>

    <div class="result-box">
        <div class="result-item">
            <strong>Lector:</strong>
            <span id="readerState">Inactivo</span>
        </div>

        <div class="result-item">
            <strong>Código leído:</strong>
            <span id="barcodeValue">-</span>
        </div>

        <div class="result-item">
            <strong>Formato:</strong>
            <span id="barcodeFormat">-</span>
        </div>
    </div>

    <div class="controls">
        <button id="btnStart">Solicitar permiso y abrir cámara</button>
        <button id="btnStop" class="danger" disabled>Cerrar cámara</button>
    </div>

    <div class="video-container">
        <div id="videoPlaceholder" class="video-placeholder">
            La cámara está desactivada
        </div>

        <video id="videoElement" autoplay playsinline muted></video>
    </div>

    <div id="logArea" class="log-area">
        Estado: Esperando acción del usuario...
    </div>
</div>

<!-- Código JavaScript del escáner -->
<script src="js/scanner.js"></script>
```

</body>
</html>
